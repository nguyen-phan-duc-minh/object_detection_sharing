app:
  name: Object Detection and Tracking
  version: 1.0.0
  env: production

data:
  source: inputs/videos
  output: outputs
  model: models
  
detector:
  type: yolo26n
  conf_threshold: 0.5
  iou_threshold: 0.7
  classes: null  # null for all classes, or list like [0, 2] for specific classes
  max_det: 100
  device: null  # null for auto, or 'cpu', 'cuda', 'mps'
  
counter:
  count_line_position: 0.5
  direction: both

saver:
  save_images: false
  save_videos: false
  save_detections: false
  save_crops: false

tracker:
  type: bytetrack  # bytetrack or strongsort
  max_age: 30
  n_init: 3
  iou_threshold: 0.3

visualizer:
  show_detections: true
  show_tracks: true
  show_count: true